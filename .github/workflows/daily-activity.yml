name: Daily activity

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add today's UTC entry
        run: |
          date -u +%F >> activity.log

      - name: Commit and push if the log changed
        run: |
          if git diff --quiet -- activity.log; then
            echo "No new activity to record."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.log
          git commit -m "Record daily activity"
          git push
